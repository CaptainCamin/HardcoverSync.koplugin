name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks and luacheck
        uses: leafo/gh-actions-luarocks@v4

      - run: luarocks install luacheck

      # Undefined and accidentally global variables (a typo, a missing require) in code no test reaches.
      # What it ignores, and why, is in .luacheckrc.
      - name: Lint
        run: luacheck .

      - name: Syntax-check every Lua file
        run: |
          status=0
          while IFS= read -r f; do
            if ! lua -e "assert(loadfile([[$f]]))"; then
              echo "SYNTAX ERROR: $f"
              status=1
            fi
          # -type f: the Lua install action puts the interpreter in a `.lua` directory in
          # the workspace, which `-name '*.lua'` also matches. It is not source.
          done < <(find . -name '*.lua' -type f -not -path './.git/*' -not -path './.lua/*' -not -path './.luarocks/*')
          exit $status

      - name: Run the harnesses
        run: ./spec/run_all.sh

      - name: Run Busted
        uses: lunarmodules/busted@v2.2.0

      # The release-notes grouping used by the Releases workflow.
      - name: Check the release notes script
        run: python3 spec/release_notes_test.py

  # Renders the plugin's screens with the real KOReader frontend, headless (spec/emu/README.md).
  # Scenarios that fail today are listed with their reasons in spec/emu/parked.txt.
  # It runs at three screen sizes with the same aspect as the Kindle Paperwhite and Kobo/Kindle 6"-7"
  # readers (spec/emu/README.md, "Screen sizes"); the first is the owner's Paperwhite 7". Narrow or
  # wide-and-short panels such as the Boox Palma are not covered yet.
  emulator:
    name: emulator ${{ matrix.size }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { size: 1264x1680, w: 1264, h: 1680, dpi: 300 } # Paperwhite 7", Libra
          - { size: 1072x1448, w: 1072, h: 1448, dpi: 300 } # Kindle 6", Kobo Clara
          - { size: 758x1024, w: 758, h: 1024, dpi: 212 }   # older 6" Kindle and Kobo
    env:
      KOREADER_VERSION: v2026.07.1
      KOREADER_SHA256: e60ed106cf4e824d50394a259b3aa6c46fb1daee189df73a1734e5732b5dc245
    steps:
      - uses: actions/checkout@v4

      - name: Download KOReader
        run: |
          curl -fsSL -o koreader.AppImage \
            "https://github.com/koreader/koreader/releases/download/${KOREADER_VERSION}/koreader-${KOREADER_VERSION}-x86_64.AppImage"
          echo "${KOREADER_SHA256}  koreader.AppImage" | sha256sum -c -
          chmod +x koreader.AppImage
          ./koreader.AppImage --appimage-extract > /dev/null

      # The plugin copies its Lato fonts into KOReader's fonts folder the first time it runs, after
      # KOReader has already tried to load them; put them there first so no run starts without.
      - name: Install the plugin's fonts
        run: cp fonts/Lato-Medium.ttf fonts/Lato-Black.ttf squashfs-root/usr/lib/koreader/fonts/

      - name: Run the emulator scenarios
        env:
          KO_EMU_APP: ${{ github.workspace }}/squashfs-root
          KO_EMU_HOME: ${{ runner.temp }}/ko-home
          KO_EMU_OUT: ${{ runner.temp }}/ko-out
          KO_EMU_W: ${{ matrix.w }}
          KO_EMU_H: ${{ matrix.h }}
          KO_EMU_DPI: ${{ matrix.dpi }}
        run: spec/emu/run.sh --ci

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screens-${{ matrix.size }}
          path: ${{ runner.temp }}/ko-out
          if-no-files-found: ignore
