name: Releases

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Busted
        uses: lunarmodules/busted@v2.2.0

      - name: Install LuaJIT
        run: sudo apt-get install -y luajit zip

      - name: Run the harnesses
        run: ./spec/run_all.sh

      # package_release.sh is the single definition of what ships; it also
      # verifies the built zip.
      - name: Zip release
        run: ./spec/package_release.sh "$RUNNER_TEMP"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/hardcoversync.koplugin.zip
