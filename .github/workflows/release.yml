name: Releases

on:
  push:
    tags:
      - '*'
  # Publish by hand (Actions > Releases > Run workflow): creates the tag at the
  # commit being run, then the release. Pushing a tag does the same.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create, e.g. v0.7.0 (must match the version in _meta.lua)'
        required: true
      prerelease:
        description: 'Publish as a pre-release from this branch (tag like v1.4.2-beta.1: the number counts the betas; the _meta.lua match is skipped, and it is never "latest")'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Busted
        uses: lunarmodules/busted@v2.2.0

      - name: Install LuaJIT
        run: sudo apt-get install -y luajit zip

      - name: Run the harnesses
        run: ./spec/run_all.sh

      # A pre-release carries its tag as its version ("1.4.1-beta.2"), so an
      # installed beta knows which beta it is and the update check can tell the
      # next one from it. Done after the harnesses, on the checkout only.
      - name: Stamp the version of a pre-release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          # the tag is typed by hand: only this shape is let near the shell and sed
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
            echo "A pre-release tag must look like v1.4.2-beta.1 (got: $TAG)"
            exit 1
          fi
          sed -i "s/^\([[:space:]]*version[[:space:]]*=[[:space:]]*\)\"[^\"]*\"/\1\"${TAG#v}\"/" _meta.lua
          grep -n 'version' _meta.lua

      # package_release.sh is the single definition of what ships; it also
      # verifies the built zip.
      - name: Zip release
        run: ./spec/package_release.sh "$RUNNER_TEMP"

      # A run started by hand must name a tag that matches the plugin's version,
      # or the App Store (which compares the tag with _meta.lua) would loop on
      # "update available".
      - name: Check the tag matches _meta.lua
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease != 'true'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          version=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' _meta.lua | head -1)
          tag="$TAG"
          if [ "${tag#v}" != "$version" ]; then
            echo "Tag $tag does not match _meta.lua version $version"
            exit 1
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ runner.temp }}/hardcoversync.koplugin.zip
