name: Releases

on:
  push:
    tags:
      - '*'
  # Publish by hand (Actions > Releases > Run workflow): creates the tag at the
  # commit being run, then the release. Pushing a tag does the same.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create: v2.1.0-stable (a stable release: the version in _meta.lua and the changelog are updated for you), v0.7.0 (stable, must already match _meta.lua), v1.4.2-beta.1 (a beta, published as a pre-release), or v1.4.2-beta to take the next beta number automatically'
        required: true
      intro:
        description: 'Optional sentence or two put above the generated release notes'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # the release notes need the earlier tags and the history back to them
          fetch-depth: 0

      # Typed as "v2.1.0-stable", the tag is v2.1.0 and the run itself updates
      # the version in _meta.lua and the changelog (see the next steps), so
      # nobody edits a file first. Typed by hand as a beta with no number ("v2.0.0-beta"), the tag gets the
      # next number after the betas already on origin, so nobody has to remember
      # the last one. A tag containing "beta" is a pre-release, and is never
      # "latest".
      - name: Work out the tag and release kind
        id: kind
        env:
          INPUT: ${{ github.event.inputs.tag }}
          REF: ${{ github.ref_name }}
        run: |
          tag=${INPUT:-$REF}
          case "$INPUT" in
            *-stable)
              tag=${INPUT%-stable}
              ;;
            *-beta)
              base=${INPUT%-beta}
              last=$(git ls-remote --tags origin "refs/tags/$base-beta.*" \
                | awk '{ print $2 }' | sed 's/\^{}$//; s|^refs/tags/||' \
                | awk -v p="$base-beta." 'index($0, p) == 1 { n = substr($0, length(p) + 1); if (n ~ /^[0-9]+$/ && n + 0 > max) max = n + 0 } END { print max + 0 }')
              tag="$base-beta.$((last + 1))"
              ;;
          esac
          case "$tag" in
            *beta*) prerelease=true ;;
            *)      prerelease=false ;;
          esac
          case "$INPUT" in
            *-stable) bump=true ;;
            *)        bump=false ;;
          esac
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release $tag: prerelease=$prerelease"

      # "v2.1.0-stable": put the version in _meta.lua and turn the changelog's
      # "Unreleased" heading into "2.1.0" (with a new empty "Unreleased" above
      # it). The commit is pushed to main only after the tests pass, and the
      # release is cut from it.
      - name: Bump the version and the changelog
        if: steps.kind.outputs.bump == 'true'
        env:
          TAG: ${{ steps.kind.outputs.tag }}
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "A stable release is cut from main (this run is on ${{ github.ref_name }})"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "A stable tag must look like v2.1.0-stable (got: $TAG)"
            exit 1
          fi
          version=${TAG#v}
          if ! grep -q '^## Unreleased' CHANGELOG.md; then
            echo 'CHANGELOG.md has no "## Unreleased" section to release'
            exit 1
          fi
          sed -i "s/^\([[:space:]]*version[[:space:]]*=[[:space:]]*\)\"[^\"]*\"/\1\"$version\"/" _meta.lua
          sed -i "0,/^## Unreleased/s//## Unreleased\n\n## $version/" CHANGELOG.md
          grep -n 'version' _meta.lua
          sed -n 1,8p CHANGELOG.md

      - name: Run Busted
        uses: lunarmodules/busted@v2.2.0

      - name: Install LuaJIT
        run: sudo apt-get install -y luajit zip

      - name: Run the harnesses
        run: ./spec/run_all.sh

      # A pre-release carries its tag as its version ("1.4.1-beta.2"), so an
      # installed beta knows which beta it is and the update check can tell the
      # next one from it. Done after the harnesses, on the checkout only.
      - name: Stamp the version of a pre-release
        if: steps.kind.outputs.prerelease == 'true'
        env:
          TAG: ${{ steps.kind.outputs.tag }}
        run: |
          # the tag is typed by hand or pushed: only this shape is let near the shell and sed
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
            echo "A pre-release tag must look like v1.4.2-beta.1 (got: $TAG)"
            exit 1
          fi
          sed -i "s/^\([[:space:]]*version[[:space:]]*=[[:space:]]*\)\"[^\"]*\"/\1\"${TAG#v}\"/" _meta.lua
          grep -n 'version' _meta.lua

      # package_release.sh is the single definition of what ships; it also
      # verifies the built zip.
      - name: Zip release
        run: ./spec/package_release.sh "$RUNNER_TEMP"

      # A run started by hand must name a tag that matches the plugin's version,
      # or the App Store (which compares the tag with _meta.lua) would loop on
      # "update available".
      - name: Check the tag matches _meta.lua
        if: github.event_name == 'workflow_dispatch' && steps.kind.outputs.prerelease == 'false'
        env:
          TAG: ${{ steps.kind.outputs.tag }}
        run: |
          version=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' _meta.lua | head -1)
          tag="$TAG"
          if [ "${tag#v}" != "$version" ]; then
            echo "Tag $tag does not match _meta.lua version $version"
            exit 1
          fi

      # The notes group the pull requests merged since the previous tag into
      # New / Improved / Fixes / For developers / Other (see the script's header
      # for how a pull request is sorted). If the script fails the release still
      # goes out, with GitHub's plain generated list instead.
      - name: Write the release notes
        id: notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.kind.outputs.tag }}
          INTRO: ${{ github.event.inputs.intro }}
        run: |
          python3 .github/scripts/release_notes.py --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --intro "$INTRO" > "$RUNNER_TEMP/release_notes.md"
          cat "$RUNNER_TEMP/release_notes.md"

      # Everything passed: keep the bump on main and release from that commit.
      - name: Commit the bump to main
        id: bump
        if: steps.kind.outputs.bump == 'true'
        env:
          TAG: ${{ steps.kind.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _meta.lua CHANGELOG.md
          git commit -m "Release ${TAG#v}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.kind.outputs.tag }}
          target_commitish: ${{ steps.bump.outputs.sha || github.sha }}
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
          body_path: ${{ steps.notes.outcome == 'success' && format('{0}/release_notes.md', runner.temp) || '' }}
          generate_release_notes: ${{ steps.notes.outcome != 'success' }}
          files: ${{ runner.temp }}/hardcoversync.koplugin.zip
