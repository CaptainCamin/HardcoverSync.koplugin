name: Releases

on:
  push:
    tags:
      - '*'
  # Publish by hand (Actions > Releases > Run workflow): creates the tag at the
  # commit being run, then the release. Pushing a tag does the same.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create: v0.7.0 (stable, must match the version in _meta.lua), v1.4.2-beta.1 (a beta, published as a pre-release), or v1.4.2-beta to take the next beta number automatically'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Typed by hand as a beta with no number ("v2.0.0-beta"), the tag gets the
      # next number after the betas already on origin, so nobody has to remember
      # the last one. A tag containing "beta" is a pre-release, and is never
      # "latest".
      - name: Work out the tag and release kind
        id: kind
        env:
          INPUT: ${{ github.event.inputs.tag }}
          REF: ${{ github.ref_name }}
        run: |
          tag=${INPUT:-$REF}
          case "$INPUT" in
            *-beta)
              base=${INPUT%-beta}
              last=$(git ls-remote --tags origin "refs/tags/$base-beta.*" \
                | awk '{ print $2 }' | sed 's/\^{}$//; s|^refs/tags/||' \
                | awk -v p="$base-beta." 'index($0, p) == 1 { n = substr($0, length(p) + 1); if (n ~ /^[0-9]+$/ && n + 0 > max) max = n + 0 } END { print max + 0 }')
              tag="$base-beta.$((last + 1))"
              ;;
          esac
          case "$tag" in
            *beta*) prerelease=true ;;
            *)      prerelease=false ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release $tag: prerelease=$prerelease"

      - name: Run Busted
        uses: lunarmodules/busted@v2.2.0

      - name: Install LuaJIT
        run: sudo apt-get install -y luajit zip

      - name: Run the harnesses
        run: ./spec/run_all.sh

      # A pre-release carries its tag as its version ("1.4.1-beta.2"), so an
      # installed beta knows which beta it is and the update check can tell the
      # next one from it. Done after the harnesses, on the checkout only.
      - name: Stamp the version of a pre-release
        if: steps.kind.outputs.prerelease == 'true'
        env:
          TAG: ${{ steps.kind.outputs.tag }}
        run: |
          # the tag is typed by hand or pushed: only this shape is let near the shell and sed
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
            echo "A pre-release tag must look like v1.4.2-beta.1 (got: $TAG)"
            exit 1
          fi
          sed -i "s/^\([[:space:]]*version[[:space:]]*=[[:space:]]*\)\"[^\"]*\"/\1\"${TAG#v}\"/" _meta.lua
          grep -n 'version' _meta.lua

      # package_release.sh is the single definition of what ships; it also
      # verifies the built zip.
      - name: Zip release
        run: ./spec/package_release.sh "$RUNNER_TEMP"

      # A run started by hand must name a tag that matches the plugin's version,
      # or the App Store (which compares the tag with _meta.lua) would loop on
      # "update available".
      - name: Check the tag matches _meta.lua
        if: github.event_name == 'workflow_dispatch' && steps.kind.outputs.prerelease == 'false'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          version=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' _meta.lua | head -1)
          tag="$TAG"
          if [ "${tag#v}" != "$version" ]; then
            echo "Tag $tag does not match _meta.lua version $version"
            exit 1
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.kind.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ runner.temp }}/hardcoversync.koplugin.zip
